<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, height=844, initial-scale=1.0">
  <title>Mockup Standalone — Antigravity san_designer (100% Code Local)</title>
  <!-- Feuilles de style locales compilées ou Tailwind inline -->
  <link rel="stylesheet" href="../../assets/css/tailwind.css">
  <style>
    /* Définition des polices locales pérennes — Zéro CDN */
    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 400 800;
      font-display: swap;
      src: url('../../assets/fonts/PlusJakartaSans-Variable.woff2') format('woff2');
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }
  </style>
</head>
<body class="h-full w-full flex items-center justify-center">
  <!-- CANVAS_SPEC: width=390px height=844px device="iPhone 15 Pro" export_scale=3 -->

  <!-- Conteneur d'Écran Calibré (390 x 844 px) -->
  <div id="canvas" class="relative w-[390px] h-[844px] bg-slate-900 text-slate-100 overflow-hidden flex flex-col justify-between shadow-2xl border border-slate-800">
    
    <!-- 1. ZONE SUPÉRIEURE : STATUT & SÉCURITÉ (Zone Passive - Hors d'Atteinte) -->
    <header class="pt-3 px-6 flex justify-between items-center text-xs font-semibold text-slate-300 z-10">
      <span>09:41</span>
      <div class="w-24 h-6 bg-black rounded-full flex items-center justify-center">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse mr-2"></div>
        <span class="text-[10px] text-slate-300">Certifié</span>
      </div>
      <div class="flex items-center space-x-1.5">
        <span class="text-[10px] font-bold">4G+</span>
        <div class="w-5 h-2.5 border border-slate-400 rounded-sm p-0.5 flex items-center">
          <div class="h-full w-3 bg-slate-200 rounded-2xs"></div>
        </div>
      </div>
    </header>

    <!-- Navigation Header -->
    <nav class="px-6 py-3 flex items-center justify-between border-b border-slate-800">
      <button type="button" class="min-h-[44px] min-w-[44px] flex items-center justify-center text-slate-300 hover:text-white active:scale-95 transition-transform" aria-label="Retour">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <h1 class="text-base font-bold text-white tracking-tight">Titre de l'Écran</h1>
      <div class="w-11"></div>
    </nav>

    <!-- 2. ZONE MÉDIANE : CONTENU & CHOIX (Zone d'Effort Modéré) -->
    <main class="flex-1 px-6 py-4 overflow-y-auto space-y-4">
      <div class="p-4 bg-slate-800/80 rounded-2xl border border-slate-700/60 shadow-md">
        <span class="text-xs font-bold uppercase tracking-wider text-amber-400">Section Principale</span>
        <p class="text-sm text-slate-200 mt-1 leading-relaxed">Contenu ergonomique scannable, textes à contraste renforcé pour plein soleil.</p>
      </div>
    </main>

    <!-- 3. ZONE INFÉRIEURE : THUMB ZONE & CTA (Zone Naturelle du Pouce) -->
    <footer class="p-6 bg-slate-900 border-t border-slate-800 space-y-3 z-10">
      <button type="button" class="w-full min-h-[50px] bg-amber-500 hover:bg-amber-400 active:scale-[0.98] text-slate-950 font-black text-sm rounded-xl shadow-lg shadow-amber-500/20 flex items-center justify-center space-x-2 transition-transform cursor-pointer">
        <span>Action Principale d'Engagement</span>
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
      </button>

      <!-- Home Indicator -->
      <div class="pt-2 flex justify-center">
        <div class="w-32 h-1 bg-slate-600 rounded-full"></div>
      </div>
    </footer>

  </div>
</body>
</html>
