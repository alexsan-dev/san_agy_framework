<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">san_ai_harness — Icône Officielle</title>
  <desc id="desc">Icône géométrique du harnais dual-engine SAN AI Harness : prisme hexagonal cyan/indigo reliant l'orchestrateur aux nœuds d'exécution et barre de validation émeraude.</desc>
