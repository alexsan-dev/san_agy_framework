<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">san_ai_harness — Logo Dark Theme</title>
  <desc id="desc">Monogramme Swiss Precision S-H de san_ai_harness pour thème sombre GitHub : rails parallèles Dual-Harness et verrou central Signal Orange.</desc>

  <!-- Swiss Precision S-H Harness Monogram (160x160 on 8px grid) -->
  <g transform="translate(28 30)">
